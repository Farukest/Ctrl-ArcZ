[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read", path = "./addresses.arc-testnet.json" },
    # Every chain after Arc. A directory rather than one more named file, because
    # the alternative is editing this list for each new network, which is the kind
    # of step that gets skipped and then debugged as a permissions error.
    { access = "read", path = "./addresses" },
]

[profile.default.fuzz]
runs = 256

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.network"
# The CCTP testnets we can deploy onto. Public endpoints on purpose: a deploy is a
# handful of transactions, and naming a keyed provider here would put a URL in the
# repo that has to be rotated rather than read.
base_sepolia = "https://sepolia.base.org"
ethereum_sepolia = "https://ethereum-sepolia-rpc.publicnode.com"
arbitrum_sepolia = "https://sepolia-rollup.arbitrum.io/rpc"
avalanche_fuji = "https://api.avax-test.network/ext/bc/C/rpc"

# Arc Testnet Explorer runs Blockscout; `forge verify-contract --verifier blockscout`
# publishes source there. Source: https://docs.arc.io/arc/tutorials/deploy-on-arc
[etherscan]
arc_testnet = { key = "", url = "https://testnet.arcscan.app/api/", chain = 5042002 }

# Transaction type: Arc supports EIP-1559 (the next block's base fee is published in
# the parent header's extra_data), and Arc's own deploy tutorial uses the standard
# 1559 flow with no `--legacy` flag. We do not pass --legacy.
