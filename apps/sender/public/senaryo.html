<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ctrl+ArcZ Simülasyonu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  color-scheme: light;
  --sky:#dcefff; --sky2:#f7fbff; --ink:#1c2550; --ink2:#48507a; --ink3:#7a81a3;
  --plum:#5b2a74; --plum-soft:#efe6f6; --line:#d6dff0; --card:#ffffff;
  --app-bg:#f3f5f9; --app-card:#ffffff; --app-line:#dfe4ee; --app-ink:#14182b; --app-mute:#6b7187;
  --orange:#e0901a; --orange-soft:#fbeed6; --ok:#1a8a55; --ok-soft:#e3f5ec; --bad:#c43a3a; --bad-soft:#fbe7e7;
  --tag-app:#b36a00; --tag-chain:#1c2550; --tag-circle:#5b2a74; --tag-server:#1f6f8b;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace; --sans:"Onest",system-ui,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);color:var(--ink);background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 55%) fixed;min-height:100%}
.wrap{max-width:none;margin:0;padding-inline:16px;padding-block:12px 16px;min-height:100vh;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;letter-spacing:-.01em}
.brand svg{width:26px;height:26px}
.brand small{font-weight:500;color:var(--ink3);font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:rgba(255,255,255,.7);color:var(--ink2);border-radius:999px;padding:7px 13px;font:500 13px var(--sans);cursor:pointer}
.tab b{font-family:var(--mono);font-weight:500;color:var(--ink3);margin-right:6px;font-size:11px}
.tab[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab[aria-selected="true"] b{color:#b9c0e6}
.tab:focus-visible,.btn:focus-visible,.logrow:focus-visible{outline:2px solid var(--plum);outline-offset:2px}
.head{margin-top:18px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.head h1{margin:0;font-size:28px;letter-spacing:-.02em;text-wrap:balance}
.head .slide{font:500 12px var(--mono);color:var(--plum);background:var(--plum-soft);padding:3px 8px;border-radius:6px}
.lead{margin:6px 0 0;color:var(--ink2);max-width:75ch;line-height:1.5}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,34%);gap:16px;margin-top:12px;align-items:stretch;flex:1}
@media (max-width:980px){.grid{grid-template-columns:1fr}}
/* browser frame */
.frame{background:#0f1428;border-radius:14px;overflow:hidden;box-shadow:0 18px 50px rgba(28,37,80,.18)}
.chrome{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#161c36}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;display:block;background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
.url{flex:1;text-align:center;font:12px var(--mono);color:#aab2d8;background:#0f1428;border-radius:6px;padding:4px 10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.net{font:600 11px var(--mono);color:#1c2550;background:#bfe0ff;border-radius:5px;padding:2px 7px}
.stage{position:relative;background:var(--app-bg);height:calc(100vh - 235px);min-height:480px;padding:22px 22px 50vh;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
/* spotlight */
.spot{position:absolute;border-radius:12px;box-shadow:0 0 0 9999px rgba(12,16,38,.55);outline:2px solid #ffd580;outline-offset:3px;pointer-events:none;transition:all .35s cubic-bezier(.2,.8,.2,1);z-index:5}
.pop{position:absolute;z-index:6;width:min(400px,calc(100% - 24px));background:#fff;border-radius:12px;padding:14px 16px 14px;box-shadow:0 14px 40px rgba(0,0,0,.28);transition:top .35s,left .35s}
.pop .meta{display:flex;align-items:center;gap:10px;font:11px var(--mono);color:var(--ink3)}
.bar{flex:1;height:3px;background:#e8ebf4;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ink)}
.pop p{margin:10px 0 12px;line-height:1.5;font-size:16px;color:var(--app-ink)}
.pop .acts{display:flex;justify-content:space-between;gap:8px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:8px 13px;font:600 13px var(--sans);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn[disabled]{opacity:.4;cursor:default}
.controls{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--ink3)}
kbd{font:11px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;background:#fff}
/* log panel */
.log{background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 130px);overflow:auto}
.log h2{margin:0;font-size:22px;display:flex;align-items:center;gap:8px}
.log .sub{margin:0;font-size:14px;color:var(--ink3)}
.logrow{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%}
.logrow.cur{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.logrow.future{display:none}
.lr-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font:600 12px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.tag.t-app{color:var(--tag-app)}.tag.t-chain,.tag.t-base{color:var(--tag-chain)}.tag.t-circle{color:var(--tag-circle)}.tag.t-server{color:var(--tag-server)}
.lr-step{font:12px var(--mono);color:var(--ink3)}
.logrow h3{margin:8px 0 6px;font-size:19px;line-height:1.3}
.logrow p{margin:0;font-size:16px;line-height:1.55;color:var(--ink2)}
.code{margin-top:10px;background:#11162e;color:#dfe5ff;border-radius:8px;padding:10px 12px;font:13.5px/1.6 var(--mono);white-space:pre;overflow-x:auto}
.code .c{color:#8f98c4}
.links{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.links a{font:500 13.5px var(--sans);color:var(--plum);text-decoration:none;background:var(--plum-soft);border-radius:6px;padding:3px 8px}
.links a:hover{text-decoration:underline}
/* ---------- agent summary ---------- */
.sum{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:14px;color:var(--app-ink)}
.sum h2{margin:0;font-size:26px;letter-spacing:-.01em}
.sum .sub{margin:0;color:var(--app-mute);font-size:15px}
.sum ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:900px){.sum ol{grid-template-columns:1fr}}
.sum li{background:#fff;border:1px solid var(--app-line);border-radius:14px;padding:16px 18px;display:flex;gap:14px}
.sum li b.n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:600 14px var(--mono)}
.sum li h3{margin:2px 0 6px;font-size:17px}
.sum li p{margin:0;font-size:15px;line-height:1.55;color:var(--ink2)}
/* ---------- mock app ---------- */
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px;color:var(--app-ink);font-size:14px}
.a-top{display:flex;justify-content:space-between;align-items:center}
.logo{font:600 16px var(--mono)}.logo span{color:var(--orange)}
.pill{border:1px solid var(--app-line);background:#fff;border-radius:9px;padding:5px 10px;font-size:12px;display:inline-flex;gap:6px;align-items:center}
.acard{background:var(--app-card);border:1px solid var(--app-line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.acard h4{margin:0;font-size:15px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:#e6eaf2;border-radius:10px;padding:3px;gap:3px}
.seg span{text-align:center;padding:7px;border-radius:8px;font-weight:600;font-size:12.5px;color:var(--app-mute)}
.seg span.on{background:#fff;color:#8a5200}
.lbl{font-weight:600;font-size:12.5px}
.inp{border:1px solid var(--app-line);background:#f6f8fb;border-radius:9px;padding:10px 12px;font:12.5px var(--mono);color:var(--app-ink);min-height:40px;display:flex;align-items:center;justify-content:space-between;gap:8px;overflow:hidden}
.inp.ph{color:#9aa0b4}
.inp .mid{background:var(--bad-soft);color:var(--bad);border-radius:3px}
.amt{border:1px solid var(--app-line);background:#f6f8fb;border-radius:10px;padding:12px}
.amt .row{display:flex;justify-content:space-between;align-items:center}
.amt .big{font-size:24px;font-weight:700}
.tok{display:inline-flex;align-items:center;gap:6px;background:#eef0f5;border-radius:999px;padding:4px 10px;font-weight:600;font-size:12px}
.cta{background:var(--orange);color:#1b1100;border-radius:10px;text-align:center;padding:11px;font-weight:700}
.cta.off{opacity:.45}
.cta.ghost{background:#fff;border:1px solid var(--app-line);color:var(--app-ink)}
.note{border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.45;display:flex;gap:8px}
.note.bad{background:var(--bad-soft);color:#7d1f1f}.note.ok{background:var(--ok-soft);color:#0f5a36}.note.info{background:#eef2fb;color:#2b3563}
.note b{display:block;margin-bottom:2px}
.codebig{font:700 22px var(--mono);letter-spacing:.12em;text-align:center;padding:10px;background:#fff8ea;border:1px dashed var(--orange);border-radius:10px}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:3px 0}
.kv span:first-child{color:var(--app-mute)}.kv span:last-child{font-family:var(--mono)}
.steps{display:flex;flex-direction:column;gap:6px}
.st{display:flex;gap:9px;align-items:center;font-size:12.5px;color:var(--app-mute)}
.st i{width:18px;height:18px;border-radius:50%;border:1.5px solid #c7cddb;display:grid;place-items:center;font-style:normal;font-size:10px;flex:none}
.st.done{color:var(--app-ink)}.st.done i{background:var(--ok);border-color:var(--ok);color:#fff}
.st.act{color:var(--app-ink);font-weight:600}.st.act i{border-color:var(--orange);border-top-color:transparent;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.st.act i{animation:none}.spot,.pop{transition:none}}
.rowi{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1px solid var(--app-line);border-radius:10px;padding:9px 11px;background:#fff}
.rowi.fresh{border-color:#8fd3b0;background:#f4fbf7}
.rowi .t{font:11px var(--mono);color:var(--app-mute)}
.rowi .m{font-size:12.5px}.rowi .m small{display:block;color:var(--app-mute);font-size:11px}
.rowi .r{text-align:right;font:12px var(--mono)}.rowi .r small{display:block;font-family:var(--sans);color:var(--app-mute);font-size:11px}
.meter{display:grid;grid-template-columns:1fr 170px;gap:12px;align-items:center;border:1px solid var(--app-line);border-radius:12px;padding:12px;background:#f8f9fc}
@media (max-width:560px){.meter{grid-template-columns:1fr}}
.gauge{position:relative}.gauge svg{width:100%;display:block}
.gauge .c{position:absolute;left:0;right:0;bottom:2px;text-align:center}
.gauge .c b{display:block;font-size:26px}.gauge .c span{font:600 10px var(--sans);letter-spacing:.08em;color:var(--ok)}
.popup{position:absolute;right:26px;top:70px;width:250px;background:#fff;border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.25);padding:14px;display:flex;flex-direction:column;gap:9px;z-index:3;font-size:12.5px;color:var(--app-ink)}
.popup .ph{display:flex;align-items:center;gap:8px;font-weight:700}
.popup .ph i{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#f6851b,#e2761b);display:block}
.term{background:#0d1122;color:#d6dcff;border-radius:12px;padding:12px 14px;font:12px/1.6 var(--mono);white-space:pre-wrap;word-break:break-all;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.term .p{color:#7fe0a8}.term .d{color:#8f98c4}.term .y{color:#ffd580}.term .r{color:#ff9a9a}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.two{grid-template-columns:1fr}}
.boxcard{border:1.5px solid var(--plum);border-radius:12px;padding:12px;background:#fbf8fd;display:flex;flex-direction:column;gap:6px}
.boxcard .h{display:flex;justify-content:space-between;font-weight:700}
.chip{font:600 10.5px var(--sans);border-radius:999px;padding:2px 8px;background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--orange-soft);color:#8a5200}.chip.gray{background:#eceff5;color:var(--app-mute)}
.flowline{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px}
.flowline span{background:#fff;border:1px solid var(--app-line);border-radius:8px;padding:5px 8px}
.flowline em{font-style:normal;color:var(--app-mute)}
.console{background:#0d1122;border-radius:12px;padding:14px;font:12px/1.7 var(--mono);color:#cfd6ff;min-height:300px}
.console .ln{display:block}.console .g{color:#7fe0a8}.console .y{color:#ffd580}.console .d{color:#7f88b5}
.footer-note{margin-top:14px;font-size:12px;color:var(--ink3)}
</style>
</head>

  const c=SC[sc];
  $('log').innerHTML=c.steps.map((s,i)=>{const [tag,title,body,code,links]=s.log;
    const tagName={app:'Uygulama',chain:'Zincir · Arc',base:'Zincir · Base',circle:'Circle',server:'Sunucu'}[tag];
    return `<button type="button" class="logrow ${i===step?'cur':''} ${i>step?'future':''}" data-i="${i}">
      <div class="lr-top"><span class="tag t-${tag}">${tagName}</span><span class="lr-step">Adım ${i+1}</span></div>
      <h3>${esc(title)}</h3><p>${esc(body)}</p>${code?`<div class="code">${code}</div>`:''}
      ${links&&links.length?`<div class="links">${links.map(l=>`<a href="${l[1]}" target="_blank" rel="noopener">${esc(l[0])} ↗</a>`).join('')}</div>`:''}</button>`}).reverse().join('');
  $('log').querySelectorAll('.logrow').forEach(b=>b.onclick=e=>{if(e.target.closest('a'))return;go(sc,+b.dataset.i)});
}
function place(){
  const c=SC[sc], s=c.steps[step];
  stage.querySelectorAll('.spot,.pop').forEach(n=>n.remove());
  const t=s.summary?null:stage.querySelector(`[data-spot="${s.spot}"]`);
  const view=stage.clientHeight;
  // Bring the highlighted part into the middle of the app window. The app is
  // taller than the window on long screens, and a spotlight below the fold
  // looked like nothing happened.
  if(t){
    const tr0=t.getBoundingClientRect(), sr0=stage.getBoundingClientRect();
    const inContent=tr0.top-sr0.top+stage.scrollTop;
    stage.scrollTop=Math.max(0, tr0.height>view-60 ? inContent-30 : inContent-(view-tr0.height)/2);
  }else stage.scrollTop=0;
  const sr=stage.getBoundingClientRect();
  const sy=stage.scrollTop;
  const spot=document.createElement('div');spot.className='spot';if(s.summary)spot.style.display='none';
  let r={left:12,top:sy+12,width:sr.width-24,height:60};
  if(t){const tr=t.getBoundingClientRect();r={left:tr.left-sr.left-6,top:tr.top-sr.top+sy-6,width:tr.width+12,height:tr.height+12}}
  Object.assign(spot.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});
  stage.appendChild(spot);
  const pop=document.createElement('div');pop.className='pop';
  const n=c.steps.length;
  pop.innerHTML=`<div class="meta">Adım ${step+1} / ${n}<span class="bar"><i style="width:${(step+1)/n*100}%"></i></span></div><p>${esc(s.text)}</p>
  <div class="acts"><button class="btn" type="button" id="pPrev" ${step===0&&sc===0?'disabled':''}>← Geri</button><button class="btn dark" type="button" id="pNext">${step===n-1?(sc<SC.length-1?'Sonraki senaryo →':'Bitti'):'Devam →'}</button></div>`;
  stage.appendChild(pop);
  const pw=pop.offsetWidth, ph=pop.offsetHeight;
  // Beside the highlight when there is room, otherwise below or above it;
  // always inside the visible part of the app window.
  let left=r.left+r.width+14, top=r.top;
  if(left+pw>sr.width-8) left=r.left-pw-14;
  if(left<8){
    left=Math.min(Math.max(8,r.left),sr.width-pw-8);
    top=r.top+r.height+14;
    if(top+ph>sy+view-8) top=r.top-ph-14;
  }
  top=Math.max(sy+8,Math.min(top,sy+view-ph-8));
  if(s.summary){left=sr.width-pw-16;top=sy+view-ph-16;}
  pop.style.left=left+'px';pop.style.top=top+'px';
  $('pPrev').onclick=prev;$('pNext').onclick=next;
}
function render(){
  const c=SC[sc];
  S=stateAt(step);
  $('slideTag').textContent=c.slide;$('scTitle').textContent=c.tab;$('scLead').textContent=c.lead;$('url').textContent=c.url;
  const cur=c.steps[step];
  stage.innerHTML=cur.summary?`<div class="sum" data-spot="summary"><h2>${esc(cur.summary.title)}</h2><p class="sub">${esc(cur.summary.sub)}</p><ol>${cur.summary.items.map((it,i)=>`<li><b class="n">${i+1}</b><div><h3>${esc(it[0])}</h3><p>${esc(it[1])}</p></div></li>`).join('')}</ol></div>`:SCREENS[c.screen]();
  renderTabs();renderLog();
  requestAnimationFrame(place);
  try{history.replaceState(null,'','#s'+(sc+1))}catch(e){}
}
function go(i,j){sc=i;step=j;render()}
function next(){const n=SC[sc].steps.length;if(step<n-1)go(sc,step+1);else if(sc<SC.length-1)go(sc+1,0)}
function prev(){if(step>0)go(sc,step-1);else if(sc>0)go(sc-1,SC[sc-1].steps.length-1)}
$('restart').onclick=()=>go(sc,0);
$('toEnd').onclick=()=>go(sc,SC[sc].steps.length-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();next()}
  else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();prev()}
  else if(/^[1-5]$/.test(e.key))go(+e.key-1,0);
});
window.addEventListener('resize',()=>requestAnimationFrame(place));
const h=(location.hash||'').match(/^#s([1-5])$/);if(h)sc=+h[1]-1;
render();
</script>

</body>
</html>
