<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ctrl+ArcZ Simülasyonu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:light;
  --sky:#dcefff;--sky2:#f7fbff;--ink:#1c2550;--ink2:#48507a;--ink3:#7a81a3;
  --plum:#5b2a74;--plum-soft:#efe6f6;--line:#d6dff0;
  --app-bg:#f3f5f9;--app-line:#dfe4ee;--app-ink:#14182b;--app-mute:#6b7187;
  --orange:#e0901a;--orange-soft:#fbeed6;--ok:#1a8a55;--ok-soft:#e3f5ec;--bad:#c43a3a;--bad-soft:#fbe7e7;
  --t-app:#b36a00;--t-chain:#1c2550;--t-circle:#5b2a74;--t-server:#1f6f8b;--t-seller:#9a3f12;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;--sans:"Onest",system-ui,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--sans);color:var(--ink);background:linear-gradient(180deg,var(--sky) 0%,var(--sky2) 55%) fixed;min-height:100vh}
.wrap{padding-inline:16px;padding-block:12px 14px;min-height:100vh;display:flex;flex-direction:column}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px}
.brand small{font-weight:500;color:var(--ink3);font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:rgba(255,255,255,.75);color:var(--ink2);border-radius:999px;padding:7px 13px;font:500 13px var(--sans);cursor:pointer}
.tab b{font:500 11px var(--mono);color:var(--ink3);margin-right:6px}
.tab[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab[aria-selected="true"] b{color:#b9c0e6}
.tab:focus-visible,.btn:focus-visible,.logrow:focus-visible{outline:2px solid var(--plum);outline-offset:2px}
.head{margin-top:12px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.head h1{margin:0;font-size:28px;letter-spacing:-.02em;text-wrap:balance}
.slide{font:500 12px var(--mono);color:var(--plum);background:var(--plum-soft);padding:3px 8px;border-radius:6px}
.lead{margin:6px 0 0;color:var(--ink2);max-width:110ch;line-height:1.5;font-size:16px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,34%);gap:16px;margin-top:12px;align-items:start;flex:1}
@media (max-width:980px){.grid{grid-template-columns:1fr}}
/* browser frame */
.frame{background:#0f1428;border-radius:14px;overflow:hidden;box-shadow:0 18px 50px rgba(28,37,80,.18)}
.chrome{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#161c36}
.dots{display:flex;gap:6px}.dots i{width:10px;height:10px;border-radius:50%;display:block;background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
.url{flex:1;text-align:center;font:12px var(--mono);color:#aab2d8;background:#0f1428;border-radius:6px;padding:4px 10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.net{font:600 11px var(--mono);color:#1c2550;background:#bfe0ff;border-radius:5px;padding:2px 7px}
.stage{position:relative;background:var(--app-bg);height:calc(100vh - 250px);min-height:480px;padding:22px 22px 50vh;overflow-y:auto;overflow-x:hidden}
/* spotlight and step box */
.spot{position:absolute;border-radius:12px;box-shadow:0 0 0 9999px rgba(12,16,38,.55);outline:2px solid #ffd580;outline-offset:3px;pointer-events:none;transition:all .35s cubic-bezier(.2,.8,.2,1);z-index:5}
.pop{position:absolute;z-index:6;width:min(400px,calc(100% - 24px));background:#fff;border-radius:12px;padding:14px 16px;box-shadow:0 14px 40px rgba(0,0,0,.28);transition:top .35s,left .35s}
.pop .meta{display:flex;align-items:center;gap:10px;font:11px var(--mono);color:var(--ink3)}
.bar{flex:1;height:3px;background:#e8ebf4;border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ink)}
.pop p{margin:10px 0 12px;line-height:1.5;font-size:16px;color:var(--app-ink)}
.pop .acts{display:flex;justify-content:space-between;gap:8px}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:8px 13px;font:600 13px var(--sans);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn[disabled]{opacity:.4;cursor:default}
.controls{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.hint-keys{font-size:12px;color:var(--ink3)}
kbd{font:11px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;background:#fff}
/* right panel */
.log{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 170px);overflow:auto}
.log h2{margin:0;font-size:22px}
.log .sub{margin:0;font-size:14px;color:var(--ink3)}
.logrow{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff;cursor:pointer;text-align:left}
.logrow.cur{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.lr-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font:600 12px var(--mono);letter-spacing:.05em;text-transform:uppercase}
.t-app{color:var(--t-app)}.t-chain,.t-base{color:var(--t-chain)}.t-circle{color:var(--t-circle)}.t-server{color:var(--t-server)}.t-seller{color:var(--t-seller)}
.lr-step{font:12px var(--mono);color:var(--ink3)}
.logrow h3{margin:8px 0 6px;font-size:19px;line-height:1.3}
.logrow p{margin:0;font-size:16px;line-height:1.55;color:var(--ink2)}
.code{margin-top:10px;background:#11162e;color:#dfe5ff;border-radius:8px;padding:10px 12px;font:13.5px/1.6 var(--mono);white-space:pre;overflow-x:auto}
.code .c{color:#8f98c4}
.links{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.links a{font:500 13.5px var(--sans);color:var(--plum);text-decoration:none;background:var(--plum-soft);border-radius:6px;padding:3px 8px}
.links a:hover{text-decoration:underline}
/* summary page */
.sum{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:14px;color:var(--app-ink)}
.sum h2{margin:0;font-size:26px;letter-spacing:-.01em}
.sum .sub{margin:0;color:var(--app-mute);font-size:16px}
.sum ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:900px){.sum ol{grid-template-columns:1fr}}
.sum li{background:#fff;border:1px solid var(--app-line);border-radius:14px;padding:16px 18px;display:flex;gap:14px}
.sum li b.n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:600 14px var(--mono)}
.sum li h3{margin:2px 0 6px;font-size:17px}
.sum li p{margin:0;font-size:15.5px;line-height:1.55;color:var(--ink2)}
/* drawn app */
.app{max-width:560px;display:flex;flex-direction:column;gap:12px;color:var(--app-ink);font-size:14px}
.wide{max-width:760px;margin-top:14px;display:flex;flex-direction:column;gap:12px;color:var(--app-ink)}
.a-top{display:flex;justify-content:space-between;align-items:center}
.logo{font:600 16px var(--mono)}.logo span{color:var(--orange)}
.pill{border:1px solid var(--app-line);background:#fff;border-radius:9px;padding:5px 10px;font-size:12px;display:inline-flex;gap:6px;align-items:center}
.acard{background:#fff;border:1px solid var(--app-line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.acard h4{margin:0;font-size:15px}
.wallet{flex-direction:row;justify-content:space-between;align-items:center;padding:10px 14px}
.modes,.seg3,.seg2{display:grid;background:#e6eaf2;border-radius:10px;padding:3px;gap:3px}
.modes{grid-template-columns:1fr 1fr}.seg3{grid-template-columns:repeat(3,1fr)}.seg2{grid-template-columns:1fr 1fr;max-width:260px}
.modes span,.seg3 span,.seg2 span{text-align:center;padding:7px;border-radius:8px;font-weight:600;font-size:12.5px;color:var(--app-mute)}
.modes span.on{background:var(--orange);color:#1b1100}
.seg3 span.on,.seg2 span.on{background:#fff;color:#8a5200}
.lbl{font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:6px}
.inp{border:1px solid var(--app-line);background:#f6f8fb;border-radius:9px;padding:10px 12px;font-size:13px;color:var(--app-ink);min-height:40px;display:flex;align-items:center;justify-content:space-between;gap:8px;overflow:hidden;word-break:break-all}
.mono{font-family:var(--mono)}
.ph{color:#9aa0b4}
.mid{background:var(--bad-soft);color:var(--bad);border-radius:3px}
.hint{font-size:12.5px;color:var(--app-mute)}
.sm{font-size:12.5px}.xs{font-size:11px}.mute{color:var(--app-mute)}.b{font-weight:700}
.btn-s{display:inline-block;border:1px solid var(--app-line);background:#fff;border-radius:8px;padding:6px 10px;font-weight:600;font-size:12.5px}
.amt{border:1px solid var(--app-line);background:#f6f8fb;border-radius:10px;padding:12px}
.amt .row{display:flex;justify-content:space-between;align-items:center}
.amt .big{font-size:24px;font-weight:700}
.tok{display:inline-flex;align-items:center;gap:6px;background:#eef0f5;border-radius:999px;padding:4px 10px;font-weight:600;font-size:12px}
.cost{border:1px solid var(--app-line);border-radius:10px;padding:10px 12px}
.cta{background:var(--orange);color:#1b1100;border-radius:10px;text-align:center;padding:11px;font-weight:700}
.cta.off{opacity:.45}
.cta.ghost{background:#fff;border:1px solid var(--app-line);color:var(--app-ink)}
.cta.sm{padding:8px}
.note{border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.45}
.note.ok{background:var(--ok-soft);color:#0f5a36}.note.info{background:#eef2fb;color:#2b3563}
.note b{display:block;margin-bottom:2px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;padding:2px 0}
.kv span:first-child{color:var(--app-mute)}
.kv.tot span{color:var(--app-ink);font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{display:flex;flex-direction:column;gap:8px}
.codebig{font:700 21px var(--mono);letter-spacing:.08em;text-align:center;padding:10px;background:#fff8ea;border:1px dashed var(--orange);border-radius:10px}
/* risk panel, as the app draws it */
.rp{border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:12.5px;line-height:1.45}
.rp--bad{background:var(--bad-soft);border:1px solid #efc5c5}
.rp--ok{background:var(--ok-soft);border:1px solid #bfe3cf}
.rp-head{font-weight:700;font-size:14px}.rp--bad .rp-head{color:var(--bad)}.rp--ok .rp-head{color:var(--ok)}
.rp-row{display:flex;gap:8px;align-items:baseline}
.rp-row i{width:8px;height:8px;border-radius:50%;flex:none;margin-top:4px}
.rp--bad .rp-row i{background:var(--bad)}.rp--ok .rp-row i{background:var(--ok)}
.rp-name{color:var(--app-mute);flex:none}.rp-res{font-weight:600}
.rp ul{margin:0 0 0 22px;padding:0;color:#5a3a3a}.rp--ok ul{color:#2d5a44}
.rp-link{font-size:11.5px;text-decoration:underline;color:var(--app-mute)}
/* stepper and rows */
.steps{display:flex;flex-direction:column;gap:6px}
.st{display:flex;gap:9px;align-items:center;font-size:12.5px;color:var(--app-mute)}
.st i{width:18px;height:18px;border-radius:50%;border:1.5px solid #c7cddb;display:grid;place-items:center;font-style:normal;font-size:10px;flex:none}
.st.done{color:var(--app-ink)}.st.done i{background:var(--ok);border-color:var(--ok);color:#fff}
.st.act{color:var(--app-ink);font-weight:600}.st.act i{border-color:var(--orange);border-top-color:transparent;animation:spin 1s linear infinite}
.grow{flex:1}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.st.act i{animation:none}.spot,.pop{transition:none}}
.rowi{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1px solid var(--app-line);border-radius:10px;padding:9px 11px;background:#fff}
.rowi.fresh{border-color:#8fd3b0;background:#f4fbf7}
.rowi .t{font:11px var(--mono);color:var(--app-mute)}
.rowi .m{font-size:12.5px}.rowi .m small{display:block;color:var(--app-mute);font-size:11px}
.rowi .r{text-align:right;font:12px var(--mono)}.rowi .r small{display:block;font-family:var(--sans);color:var(--app-mute);font-size:11px}
.boxcard{border:1.5px solid var(--app-line);border-radius:12px;padding:12px;background:#fff;display:flex;flex-direction:column;gap:6px}
.boxcard .h{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.chip{font:600 10.5px var(--sans);border-radius:999px;padding:2px 8px;background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--orange-soft);color:#8a5200}.chip.gray{background:#eceff5;color:var(--app-mute)}
.toast{align-self:flex-start;background:#123d2a;color:#e3f5ec;border-radius:9px;padding:7px 12px;font-size:12.5px;font-weight:600}
/* pay per request */
.meter{display:grid;grid-template-columns:1fr 180px;gap:12px;align-items:center;border:1px solid var(--app-line);border-radius:12px;padding:12px;background:#f8f9fc}
.gauge{position:relative}.gauge svg{width:100%;display:block}
.gauge .c{position:absolute;left:0;right:0;bottom:2px;text-align:center}
.gauge .c b{display:block;font-size:26px}.gauge .c span{font:600 10px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--ok)}
.claude{font-weight:800;color:#D97757}
.menu{border:1px solid var(--app-line);border-radius:10px;background:#fff;overflow:hidden}
.opt{padding:9px 12px;font-size:13px;border-top:1px solid var(--app-line);display:flex;gap:8px;align-items:center}
.opt:first-child{border-top:0}.opt.on{background:#fff6e6}
/* where the money is */
.money{display:grid;grid-template-columns:1fr auto 1.2fr auto 1fr;align-items:center;gap:8px;border:1.5px dashed #c9b3dc;border-radius:12px;background:#fff;padding:14px}
.money-h{grid-column:1/-1;font-weight:700;font-size:14px}
.mbox{border:1px solid var(--app-line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;font-size:12.5px;background:#f8f9fc;min-width:0}
.mbox b{font-size:13.5px}
.mbox span{color:var(--app-mute)}
.mbox em{font:700 18px var(--mono);font-style:normal;color:var(--app-ink)}
.mbox.gw{border-color:#c9b3dc;background:#f7f1fb}
.marrow{display:flex;flex-direction:column;align-items:center;font-size:11.5px;color:var(--app-mute);text-align:center;gap:2px;max-width:110px}
.marrow i{font-style:normal;font-size:20px;line-height:1;color:var(--ink2)}
@media (max-width:760px){.money{grid-template-columns:1fr}.marrow{max-width:none}.marrow i{transform:rotate(90deg)}}
.term{background:#0d1122;color:#d6dcff;border-radius:12px;padding:12px 14px;font:12.5px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word}
.term .p{color:#7fe0a8}.term .y{color:#ffd580}.term .d{color:#8f98c4}
/* x402 sequence */
.seq{border:1px solid var(--app-line);border-radius:12px;background:#fff;padding:12px 10px 10px}
.seq-heads{display:grid;grid-template-columns:repeat(4,1fr);text-align:center;font-size:12.5px;font-weight:700}
.seq-heads small{display:block;font-weight:500;color:var(--app-mute);font-size:11px}
.seq-body{position:relative;margin-top:8px;min-height:20px;background:
  linear-gradient(var(--app-line),var(--app-line)) 12.5% 0/1px 100% no-repeat,
  linear-gradient(var(--app-line),var(--app-line)) 37.5% 0/1px 100% no-repeat,
  linear-gradient(var(--app-line),var(--app-line)) 62.5% 0/1px 100% no-repeat,
  linear-gradient(var(--app-line),var(--app-line)) 87.5% 0/1px 100% no-repeat}
.seq-row{position:relative;height:40px}
.seq-arrow{position:absolute;top:26px;height:2px;background:#9aa3c4}
.seq-arrow::after{content:"";position:absolute;top:-4px;border:5px solid transparent}
.seq-arrow.r::after{right:-2px;border-left:7px solid #9aa3c4;border-right:0}
.seq-arrow.l::after{left:-2px;border-right:7px solid #9aa3c4;border-left:0}
.seq-label{position:absolute;top:5px;transform:translateX(-50%);font-size:12px;white-space:nowrap;color:var(--app-ink);background:#fff;padding:0 6px;border-radius:4px}
.seq-row.hi .seq-arrow{background:var(--orange)}
.seq-row.hi .seq-arrow.r::after{border-left-color:var(--orange)}.seq-row.hi .seq-arrow.l::after{border-right-color:var(--orange)}
.seq-row.hi .seq-label{color:#8a5200;font-weight:700}
.seq-note{margin-top:6px;font-size:12px;color:var(--app-mute);text-align:center}
/* wallet prompt */
.popup{position:absolute;right:26px;top:70px;width:270px;background:#fff;border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.25);padding:14px;display:flex;flex-direction:column;gap:8px;z-index:3;font-size:12.5px;color:var(--app-ink)}
.popup .ph2{display:flex;align-items:center;gap:8px;font-weight:700}
.popup .ph2 i{width:22px;height:22px;border-radius:6px;background:linear-gradient(135deg,#f6851b,#e2761b);display:block}
.popup .pt{font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" viewBox="0 0 24 24" aria-hidden="true"><path fill="url(#arcB)" d="M3.5 20.999c.146-4.407.893-8.519 2.142-11.717C7.223 5.231 9.513 3 12.088 3s4.865 2.231 6.447 6.283c.822 2.107 1.427 4.61 1.786 7.334q.048.366.087.737.015.024.013.041s.21 1.317.256 3.604h-.024c-.313-.256-4-3.153-10.112-2.314.093-1.035.22-2.04.383-3.005l.027-.146a24.5 24.5 0 0 1 6.104.57q-.007-.056-.017-.115c-.33-2.06-.819-3.945-1.448-5.556-1.029-2.635-2.371-4.271-3.502-4.271-1.132 0-2.474 1.636-3.503 4.271q-.375.958-.679 2.034a30 30 0 0 0-.718 3.213A40 40 0 0 0 6.662 21H3.5z"/><defs><linearGradient id="arcB" x1="12.088" x2="12.088" y1="3" y2="21" gradientUnits="userSpaceOnUse"><stop stop-color="#182680"/><stop offset="1" stop-color="#842D56"/></linearGradient></defs></svg>
      Ctrl+ArcZ <small>adım adım simülasyon</small>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </header>

  <div class="head"><span class="slide" id="slideTag"></span><h1 id="scTitle"></h1></div>
  <p class="lead" id="scLead"></p>

  <div class="grid">
    <section>
      <div class="frame">
        <div class="chrome"><div class="dots"><i></i><i></i><i></i></div><div class="url" id="url"></div><span class="net">Arc mainnet</span></div>
        <div class="stage" id="stage"></div>
      </div>
      <div class="controls">
        <div style="display:flex;gap:8px">
          <button class="btn" id="restart" type="button">↺ Baştan başla</button>
          <button class="btn" id="toEnd" type="button">Sonuca geç ▸</button>
        </div>
        <span class="hint-keys"><kbd>←</kbd> <kbd>→</kbd> adımlar · <kbd>1</kbd> ile <kbd>4</kbd> arası senaryolar</span>
      </div>
    </section>
    <aside class="log" aria-live="polite">
      <h2>Ne oldu?</h2>
      <p class="sub">Her adımda uygulamada, zincirde ve Circle tarafında olan.</p>
      <div id="log" style="display:flex;flex-direction:column;gap:8px"></div>
    </aside>
  </div>
</div>

<script>
/* ------------------------------------------------------------------ */
/* Real addresses, transactions and links                             */
/* ------------------------------------------------------------------ */
const EX = "https://explorer.arc.io";
const GH = "https://github.com/Farukest/Ctrl-ArcZ/blob/main/";
const A = {
  ctrl: "0x99880dC312d8e73c331487ae26B5b021857833aE",

        const x = (2 * lo + 1) * 12.5, w = (up - lo) * 25;
        return `<div class="seq-row ${hi.includes(i) ? "hi" : ""}"><div class="seq-arrow ${b > a ? "r" : "l"}" style="left:${x}%;width:${w}%"></div><div class="seq-label" style="left:${x + w / 2}%">${esc(r[2])}</div></div>`;
      }).join("");
      const cmd = `<span class="p">$</span> curl -i https://ctrlarcz.xyz/api/nano/v1/messages \\
    -H "x-api-key: ctz_…" \\
    -H "content-type: application/json" \\
    -d '{"model":"claude-haiku-4-5","max_tokens":80,
         "messages":[{"role":"user","content":"Tek cümleyle: Circle Gateway nedir?"}]}'`;
      const answer = S.term >= 2 ? `

<span class="y">HTTP/1.1 200 OK
x-nano-paid: 0.003000</span>
<span class="d"># cevaptaki metin:</span>
Circle Gateway, blockchain ağlarında kripto varlıkları yönetmek ve transfer etmek için kullanılan bir fintech platformudur.` : "";
      flow = `<div class="col" data-spot="flow" style="gap:12px">
        <div class="term">${cmd}${answer}</div>
        <div class="seq"><div class="seq-heads"><div>Ayşe'nin programı<small>terminal</small></div><div>Ctrl+ArcZ sunucusu<small>ajan cüzdanı burada</small></div><div>BlockRun<small>Claude'u satan servis</small></div><div>Circle Gateway<small>ödemeyi onaylar</small></div></div>
        <div class="seq-body">${rows}</div>
        ${S.batch ? `<div class="seq-note">Circle bu ödemeleri toplar ve birkaç dakikada bir tek işlemle Arc'a yazar.</div>` : ""}</div></div>`;
    }
    const pop = S.popup === "sign" ? sign("Mesaj imzası", [["Amaç", "cüzdanın sahibi olduğunu kanıtlamak"], ["Para hareketi", "yok"]])
      : S.popup === "dep" ? sign("Gateway'e yatırma", [["Kimin adına", "ajan cüzdanı 0xeb5F…b3c0"], ["Tutar", "0.05 USDC"], ["İşlemler", "USDC onayı ve yatırma"]]) : "";
    return `<div class="app">${wallet("0x05a1…9577", "")}${modes("send")}${tabs("sub")}
      <div class="acard" data-spot="panel"><h4>Kullandıkça öde</h4>
        <div class="lbl">Satıcı</div><div class="inp"><span><span class="claude">A\\</span> Claude API</span><span>▾</span></div>
        ${panel}</div>${pop}</div>${money || flow ? `<div class="wide">${money}${flow}</div>` : ""}`;
  }
};

/* ------------------------------------------------------------------ */
/* Engine                                                             */
/* ------------------------------------------------------------------ */
const TAGS = { app: "Uygulama", chain: "Zincir · Arc", base: "Zincir · Base", circle: "Circle", server: "Sunucumuz", seller: "Satıcı · BlockRun" };
let sc = 0, step = 0;
const $ = id => document.getElementById(id);
const stage = $("stage");

function stateAt(i) { const o = {}; for (let k = 0; k <= i; k++) Object.assign(o, SC[sc].steps[k].st || {}); return o; }

function summaryHtml(m) {
  return `<div class="sum" data-spot="summary"><h2>${esc(m.title)}</h2>${m.sub ? `<p class="sub">${esc(m.sub)}</p>` : ""}
  <ol>${m.items.map((it, i) => `<li><b class="n">${i + 1}</b><div><h3>${esc(it[0])}</h3><p>${esc(it[1])}</p></div></li>`).join("")}</ol></div>`;
}

function renderTabs() {
  $("tabs").innerHTML = SC.map((s, i) => `<button class="tab" role="tab" type="button" aria-selected="${i === sc}" data-i="${i}"><b>${i + 1}</b>${esc(s.tab)}</button>`).join("");
  $("tabs").querySelectorAll(".tab").forEach(b => b.onclick = () => go(+b.dataset.i, 0));
}

function renderLog() {
  const c = SC[sc];
  $("log").innerHTML = c.steps.map((s, i) => {
    if (i > step) return "";
    const g = s.log;
    return `<div class="logrow ${i === step ? "cur" : ""}" data-i="${i}" tabindex="0">
      <div class="lr-top"><span class="tag t-${g.tag}">${TAGS[g.tag]}</span><span class="lr-step">Adım ${i + 1}</span></div>
      <h3>${esc(g.title)}</h3>${g.body ? `<p>${esc(g.body)}</p>` : ""}
      ${g.code ? `<div class="code">${codeHtml(g.code)}</div>` : ""}
      ${g.links && g.links.length ? `<div class="links">${g.links.map(l => `<a href="${l[1]}" target="_blank" rel="noopener">${esc(l[0])} ↗</a>`).join("")}</div>` : ""}</div>`;
  }).reverse().join("");
  $("log").querySelectorAll(".logrow").forEach(b => b.onclick = e => { if (e.target.closest("a")) return; go(sc, +b.dataset.i); });
}

function place() {
  const c = SC[sc], s = c.steps[step];
  stage.querySelectorAll(".spot,.pop").forEach(n => n.remove());
  const t = s.summary ? null : stage.querySelector(`[data-spot="${s.spot}"]`);
  const view = stage.clientHeight;
  if (t) {
    const tr0 = t.getBoundingClientRect(), sr0 = stage.getBoundingClientRect();
    const inContent = tr0.top - sr0.top + stage.scrollTop;
    stage.scrollTop = Math.max(0, tr0.height > view - 60 ? inContent - 30 : inContent - (view - tr0.height) / 2);
  } else stage.scrollTop = 0;
  const sr = stage.getBoundingClientRect();
  const sy = stage.scrollTop;
  let r = null;
  if (t) {
    const tr = t.getBoundingClientRect();
    r = { left: tr.left - sr.left - 6, top: tr.top - sr.top + sy - 6, width: tr.width + 12, height: tr.height + 12 };
    const spot = document.createElement("div"); spot.className = "spot";
    Object.assign(spot.style, { left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px" });
    stage.appendChild(spot);
  }
  const pop = document.createElement("div"); pop.className = "pop";
  const n = c.steps.length;
  const last = step === n - 1;
  pop.innerHTML = `<div class="meta">Adım ${step + 1} / ${n}<span class="bar"><i style="width:${(step + 1) / n * 100}%"></i></span></div><p>${esc(s.text)}</p>
  <div class="acts"><button class="btn" type="button" id="pPrev" ${step === 0 && sc === 0 ? "disabled" : ""}>← Geri</button><button class="btn dark" type="button" id="pNext">${last ? (sc < SC.length - 1 ? "Sonraki senaryo →" : "Bitti") : "Devam →"}</button></div>`;
  stage.appendChild(pop);
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let left, top;
  if (!r) { left = sr.width - pw - 16; top = sy + view - ph - 16; }
  else {
    left = r.left + r.width + 14; top = r.top;
    if (left + pw > sr.width - 8) left = r.left - pw - 14;
    if (left < 8) {
      left = Math.min(Math.max(8, r.left), sr.width - pw - 8);
      top = r.top + r.height + 14;
      if (top + ph > sy + view - 8) top = r.top - ph - 14;
    }
    top = Math.max(sy + 8, Math.min(top, sy + view - ph - 8));
  }
  pop.style.left = left + "px"; pop.style.top = top + "px";
  $("pPrev").onclick = prev; $("pNext").onclick = next;
}

function render() {
  const c = SC[sc], cur = c.steps[step];
  S = stateAt(step);
  $("slideTag").textContent = c.slide; $("scTitle").textContent = c.title; $("scLead").textContent = c.lead; $("url").textContent = c.url;
  stage.innerHTML = cur.summary ? summaryHtml(cur.summary) : SCREENS[c.screen]();
  renderTabs(); renderLog();
  requestAnimationFrame(place);
  try { history.replaceState(null, "", "#s" + (sc + 1)); } catch (e) { /* some frames refuse it */ }
}
function go(i, j) { sc = i; step = j; render(); }
function next() { const n = SC[sc].steps.length; if (step < n - 1) go(sc, step + 1); else if (sc < SC.length - 1) go(sc + 1, 0); }
function prev() { if (step > 0) go(sc, step - 1); else if (sc > 0) go(sc - 1, SC[sc - 1].steps.length - 1); }
$("restart").onclick = () => go(sc, 0);
$("toEnd").onclick = () => go(sc, SC[sc].steps.length - 1);
document.addEventListener("keydown", e => {
  if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); next(); }
  else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); prev(); }
  else if (/^[1-4]$/.test(e.key)) go(+e.key - 1, 0);
});
window.addEventListener("resize", () => requestAnimationFrame(place));
const h = (location.hash || "").match(/^#s([1-4])$/); if (h) sc = +h[1] - 1;
render();
</script>
